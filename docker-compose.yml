# piper-tts-server — Docker Compose.
# Two profiles are provided: `cpu` (default) and `gpu`.
#   docker compose up cpu          # CPU inference
#   docker compose --profile gpu up  # CUDA GPU inference (needs NVIDIA driver + nvidia-container-toolkit)

services:
  tts-cpu:
    image: piper-tts-server:cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu
    profiles: ["cpu"]
    ports:
      - "${TTS_PORT:-8000}:8000"
    environment:
      TTS_DEVICE: cpu
      TTS_VOICE_CACHE_DIR: /data/voices
      TTS_MAX_LOADED_VOICES: ${TTS_MAX_LOADED_VOICES:-4}
      # Optional HuggingFace token for gated/private voice repos.
      TTS_HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - voices:/data/voices
    restart: unless-stopped

  tts-gpu:
    image: piper-tts-server:gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    profiles: ["gpu"]
    ports:
      - "${TTS_PORT:-8000}:8000"
    environment:
      TTS_DEVICE: cuda
      TTS_VOICE_CACHE_DIR: /data/voices
      TTS_MAX_LOADED_VOICES: ${TTS_MAX_LOADED_VOICES:-4}
      TTS_HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - voices:/data/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  # Named volume so downloaded voice models persist across container restarts.
  voices:
