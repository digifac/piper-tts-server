# Deployment for piper-tts-server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper-tts
  labels:
    app: piper-tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piper-tts
  template:
    metadata:
      labels:
        app: piper-tts
    spec:
      containers:
        - name: tts
          image: piper-tts-server # replace with your registry path, e.g. ghcr.io/<you>/piper-tts-server
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TTS_VOICE_CACHE_DIR
              value: "/data/voices"
            - name: TTS_MAX_LOADED_VOICES
              value: "4"
          volumeMounts:
            - name: voices
              mountPath: /data/voices
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              # Sized for up to MAX_LOADED_VOICES (4) large voice models + ONNX runtime overhead.
              memory: "3Gi"
      volumes:
        - name: voices
          persistentVolumeClaim:
            claimName: piper-tts-voices
