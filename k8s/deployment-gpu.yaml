# GPU deployment for piper-tts-server.
# Requires a node with an NVIDIA GPU, the nvidia device plugin (nvidia.com/gpu),
# and the image built from Dockerfile.gpu (onnxruntime-gpu + cuDNN).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper-tts-gpu
  labels:
    app: piper-tts
    variant: gpu
spec:
  replicas: 1 # keep at 1 per GPU node unless you have multiple GPUs / nodes
  selector:
    matchLabels:
      app: piper-tts
      variant: gpu
  template:
    metadata:
      labels:
        app: piper-tts
        variant: gpu
    spec:
      # Schedule only on GPU-capable nodes. Adjust the label to match your cluster's
      # GPU node labeling (e.g. nvidia.com/gpu.present=true).
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: tts
          image: piper-tts-server:gpu # replace with your registry path, e.g. ghcr.io/<you>/piper-tts-server:gpu
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TTS_DEVICE
              value: "cuda"
            - name: TTS_VOICE_CACHE_DIR
              value: "/data/voices"
            - name: TTS_MAX_LOADED_VOICES
              value: "4"
            # Optional HuggingFace token for gated/private voice repos.
            # Uncomment and reference a Secret if needed:
            # - name: TTS_HF_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: piper-tts-secret
            #       key: hf_token
          volumeMounts:
            - name: voices
              mountPath: /data/voices
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20 # allow time for CUDA context init on first load
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "3Gi"
              nvidia.com/gpu: 1 # request one GPU via the NVIDIA device plugin
      volumes:
        - name: voices
          persistentVolumeClaim:
            claimName: piper-tts-voices
