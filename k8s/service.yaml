# Service exposing the piper-tts-server HTTP API.
# Selects the deployment via the `app: piper-tts` label.
apiVersion: v1
kind: Service
metadata:
  name: piper-tts
spec:
  type: ClusterIP # change to LoadBalancer/NodePort if you need external access
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: piper-tts
