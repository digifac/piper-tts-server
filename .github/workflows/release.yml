name: Release

# Triggered only on beta tags (v0.*). To support v1+ later, widen the pattern.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write # create GitHub release
  packages: write # push to GHCR

jobs:
  check-tag:
    name: Check tag exists
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_tag: ${{ steps.check.outputs.has_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check if HEAD is a tag
        id: check
        run: |
          TAGS=$(git tag --points-at HEAD)
          # Filter for v0.* pattern (beta tags only)
          MATCHING=$(echo "$TAGS" | grep -E '^v0\.' || true)
          if [ -n "$MATCHING" ]; then
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$MATCHING" >> "$GITHUB_OUTPUT"
          else
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build & push image (amd64)
    needs: [check-tag]
    if: needs.check-tag.outputs.has_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the version from the tag (strip leading "v"). v0.1.0 -> 0.1.0
      - name: Extract version and owner
        id: ver
        run: |
          VERSION="${{ needs.check-tag.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      # Single GHCR package with versioned + latest tags.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64 # amd64 only for now (no QEMU needed)
          push: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/piper-tts-server:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner }}/piper-tts-server:latest

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-tag, build-push]
    if: needs.check-tag.outputs.has_tag == 'true'
    steps:
      # Re-derive the version from check-tag output.
      - name: Extract version
        id: ver
        run: |
          VERSION="${{ needs.check-tag.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Image Docker (GHCR)

            | Tag image GHCR | Pull |
            |---|---|
            | `${{ steps.ver.outputs.version }}`     | `docker pull ghcr.io/digifac/piper-tts-server:${{ steps.ver.outputs.version }}` |

            > L'image est aussi disponible sous le tag `latest`.
            > Architecture : amd64 uniquement pour l'instant.
