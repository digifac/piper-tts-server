name: Release

# Triggered only on beta tags (v0.*). To support v1+ later, widen the pattern.
on:
  push:
    tags: ["v0.*"]

permissions:
  contents: write # create GitHub release
  packages: write # push to GHCR

jobs:
  build-push:
    name: Build & push image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the version from the tag (strip leading "v"). v0.1.0 -> 0.1.0
      - name: Extract version and owner
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      # Single GHCR package with versioned + latest tags.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64 # amd64 only for now (no QEMU needed)
          push: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/piper-tts-server:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner }}/piper-tts-server:latest

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      # $GITHUB_ENV is not shared across jobs, so re-derive the version here.
      - name: Extract version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Image Docker (GHCR)

            | Tag image GHCR | Pull |
            |---|---|
            | `${{ steps.ver.outputs.version }}`     | `docker pull ghcr.io/digifac/piper-tts-server:${{ steps.ver.outputs.version }}` |

            > L'image est aussi disponible sous le tag `latest`.
            > Architecture : amd64 uniquement pour l'instant.
